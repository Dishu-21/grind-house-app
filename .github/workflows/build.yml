name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs Gradle itself (rather than relying on a checked-in gradlew
      # wrapper jar) and caches it between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: grind-house-focus-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
